<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>Rekenportal</title>
  <link rel="icon" type="image/png" href="img/favicon.png?v=3" />
  <link rel="apple-touch-icon" href="img/logo.png?v=3" />
  <link rel="stylesheet" href="css/nyan-cat.css?v=2" />
  <link rel="stylesheet" href="css/stijl.css?v=11" />
</head>
<body>
  <main id="app" class="pagina" aria-live="polite">
    <!-- De inhoud van elk scherm wordt hier door main.js ingevoegd. -->
  </main>

  <!-- Floating muziek-control bar (altijd zichtbaar, ongeacht scherm) -->
  <div id="muziek-bar" class="muziek-bar muziek-bar--hidden" role="region" aria-label="Muziekbediening">
    <button id="muziek-toggle" class="muziek-bar__knop" aria-label="Muziek aan/uit">🎵</button>
    <span id="muziek-track" class="muziek-bar__track">–</span>
    <button id="muziek-mute" class="muziek-bar__knop muziek-bar__knop--klein" aria-label="Dempen">🔊</button>
    <input type="range" id="muziek-volume" class="muziek-bar__slider" min="0" max="100" value="50" aria-label="Volume" />
  </div>

  <script type="module" src="js/main.js?v=12"></script>
</body>
</html>
